name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verification:
    name: Python, Julia, C, Lean and Macaulay2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install python-flint and sympy (degree-114 checks)
        run: python3 -m pip install "python-flint==0.9.0" "sympy==1.14.0"
      - name: Install Macaulay2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends macaulay2
      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run every check
        run: STRICT=1 bash verification/shell/run_all.sh

  lean-mathlib:
    name: Lean 4 with Mathlib (Fermat fourfolds and degree 114)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and print the axioms of the main theorems
        working-directory: verification/lean-mathlib
        run: |
          lake exe cache get
          lake build
          lake env lean Axioms.lean | tee axioms.txt
          test "$(grep -c 'depends on axioms: \[propext, Classical.choice, Quot.sound\]' axioms.txt)" = 13
          test "$(grep -cE 'depends on axioms: \[(propext|Classical.choice|Quot.sound|, )*\]|does not depend on any axioms' axioms.txt)" = 18
          if grep -q sorryAx axioms.txt; then exit 1; fi
          if grep -rnE '\bsorry\b|native_decide' FermatHodge FermatHodge.lean; then exit 1; fi

  paper:
    name: Paper, tex.zip and arXiv tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern poppler-utils zip
      - name: Build
        run: bash scripts/build_paper.sh
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: dist/
